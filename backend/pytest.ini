[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage is measured on every run and gated in CI. The floor is set just
# below the current combined line rate (~62%) so it locks in progress and fails
# the build on a regression, without demanding new tests to go green today.
# Ratchet it upward as the thin services (news, risk, signals, advisor) gain
# tests.
#
# Scope covers the decision-critical library code, not just the API surface: it
# previously gated only `api`, leaving risk_engine, portfolio_optimizer,
# signal_inference, the price-action/point-in-time features and the market-data
# providers ungated — a regression in the numbers users act on would not have
# failed the build. The operational glue (celery workers, training entrypoints,
# scrapers, db/migrate, scripts) is deliberately excluded: it is exercised by
# integration/manual verification, not unit-testable line-by-line, so gating it
# would only force low-value tests or drag the floor down to no purpose.
addopts =
    --cov=api
    --cov=ml/inference
    --cov=ml/features
    --cov=ingestor/providers
    --cov-report=term-missing
    --cov-fail-under=60
