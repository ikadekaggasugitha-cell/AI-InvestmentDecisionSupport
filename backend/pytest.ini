[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Coverage is measured on every run and gated in CI. The floor is set just
# below the current line rate (64%) so it locks in progress and fails the build
# on a regression, without demanding new tests to go green today. Ratchet it
# upward as the thin services (news, risk, signals, advisor) gain tests.
addopts =
    --cov=api
    --cov-report=term-missing
    --cov-fail-under=60
