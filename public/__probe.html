<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>focus probe</title>
<style>html,body{margin:0;padding:0;background:#fff;overflow:hidden}</style>
</head>
<body>
<script>
/* Throwaway probe for the hover/focus affordance, not committed. Loads the
   real page, then puts keyboard focus on the first topbar anchor so the
   :focus-visible state (underline + navy) can be captured headlessly. */
const iframe = document.createElement("iframe");
iframe.style.cssText = "border:0;display:block;width:1920px;height:140px";
iframe.src = "/";
document.body.appendChild(iframe);
iframe.addEventListener("load", () => setTimeout(() => {
  const doc = iframe.contentDocument;
  const a = doc.querySelector(".pub-nav a");
  if (!a) { console.log("PROBE no-anchor"); return; }
  a.focus();
  setTimeout(() => console.log("PROBE focused sheet:" + (doc.querySelector(".pub-hero") ? "yes" : "no")), 400);
}, 2500));
</script>
</body>
</html>
